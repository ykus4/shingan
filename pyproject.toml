[project]
name = "shingan"
version = "0.1.0"
description = "iOS IPA static analysis tool — visualizes where your app is vulnerable to reverse engineering"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "biplist>=1.0.3",
    "click>=8.3.3",
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "lief>=0.17.6",
    "python-multipart>=0.0.27",
    "rich>=15.0.0",
    "uvicorn>=0.46.0",
]

[project.scripts]
shingan = "shingan.cli:cli"
