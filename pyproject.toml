[project]
name = "shingan"
version = "1.0.0"
description = "iOS IPA static analysis tool — visualizes where your app is vulnerable to reverse engineering"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "androguard>=4.1.4",
    "click>=8.3.3",
    "fastapi>=0.140.0",
    "jinja2>=3.1.6",
    "lief>=0.17.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "uvicorn>=0.48.0",
    "weasyprint>=61.0",
]

[project.optional-dependencies]
dynamic = [
    "frida>=17.9.11",
    "frida-tools>=12.4.0",
]

[project.scripts]
shingan = "shingan.cli:cli"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.0.3",
    "ruff>=0.16.2",
]
